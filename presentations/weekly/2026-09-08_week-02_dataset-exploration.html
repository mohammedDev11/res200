<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Week 02 dataset exploration for the Audio Question Answering research project">
  <title>Dataset Exploration | RES200 Week 02</title>
  <style>
    :root {
      --kfupm-green: #187d43;
      --deep-green: #0d4f2d;
      --mint: #eaf4ee;
      --ink: #16241c;
      --muted: #587064;
      --paper: #fbfdfb;
      --line: #cfe1d6;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071d11;
      color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    button, a { font: inherit; }

    .deck {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(28px, 4.2vw, 72px) clamp(32px, 6vw, 104px) clamp(26px, 3.8vw, 58px);
      background:
        linear-gradient(90deg, var(--kfupm-green) 0 12px, transparent 12px),
        var(--paper);
      opacity: 0;
      visibility: hidden;
      transform: translateX(24px);
      transition: opacity 180ms ease, transform 180ms ease, visibility 180ms;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
      z-index: 2;
    }

    .slide.previous { transform: translateX(-24px); }

    .slide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 72px;
      border-bottom: 2px solid var(--line);
      padding-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--deep-green);
      font-weight: 800;
      letter-spacing: .08em;
      font-size: clamp(13px, 1.1vw, 18px);
      text-transform: uppercase;
    }

    .brand img {
      width: 31px;
      height: 46px;
      object-fit: contain;
    }

    .slide-number {
      color: var(--muted);
      font-size: clamp(13px, 1vw, 17px);
      font-variant-numeric: tabular-nums;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(250px, .62fr);
      align-items: center;
      gap: clamp(36px, 6vw, 110px);
      padding: clamp(30px, 5vh, 64px) 0;
    }

    .category {
      margin: 0 0 14px;
      color: var(--kfupm-green);
      font-size: clamp(14px, 1.2vw, 19px);
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 900px;
      color: var(--deep-green);
      font-size: clamp(42px, 5.6vw, 88px);
      line-height: .98;
      letter-spacing: -.045em;
    }

    .summary {
      max-width: 850px;
      margin: 28px 0 0;
      color: #344c3e;
      font-size: clamp(19px, 1.7vw, 29px);
      line-height: 1.48;
    }

    .facts {
      border-left: 3px solid var(--kfupm-green);
      padding-left: clamp(24px, 3vw, 44px);
    }

    .fact {
      margin-bottom: clamp(18px, 2.4vh, 30px);
    }

    .fact:last-child { margin-bottom: 0; }

    .fact-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: clamp(13px, 1vw, 17px);
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .fact-value {
      color: var(--ink);
      font-size: clamp(20px, 1.8vw, 30px);
      font-weight: 750;
      line-height: 1.24;
    }

    .availability {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
    }

    .availability span {
      position: relative;
      padding-left: 18px;
      color: var(--ink);
      font-size: clamp(17px, 1.45vw, 24px);
      font-weight: 700;
    }

    .availability span::before {
      content: "";
      position: absolute;
      left: 0;
      top: .45em;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #bdc9c1;
    }

    .availability .yes::before { background: var(--kfupm-green); }

    .slide-footer {
      position: absolute;
      left: clamp(24px, 3vw, 48px);
      right: clamp(24px, 3vw, 48px);
      bottom: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      min-height: 20px;
    }

    .dataset-link {
      display: inline-block;
      margin-top: 26px;
      color: var(--deep-green);
      font-size: clamp(15px, 1.2vw, 20px);
      font-weight: 800;
      text-decoration: none;
      border-bottom: 2px solid var(--kfupm-green);
      padding-bottom: 4px;
    }

    .dataset-link:hover,
    .dataset-link:focus-visible {
      color: var(--kfupm-green);
      outline: none;
    }

    .hint {
      color: var(--muted);
      font-size: clamp(12px, .95vw, 16px);
    }

    .presentation-date {
      margin: 0 0 18px;
      color: #d8eee1;
      font-size: clamp(16px, 1.35vw, 22px);
      font-weight: 700;
      letter-spacing: .04em;
    }

    .presenter-info {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 28px;
      color: var(--deep-green);
      font-size: clamp(11px, .82vw, 15px);
      font-weight: 700;
    }

    .presenter { text-align: right; }

    .cover {
      background:
        linear-gradient(110deg, rgba(9, 66, 36, .98), rgba(24, 125, 67, .94)),
        var(--deep-green);
      color: white;
    }

    .cover .slide-header { border-color: rgba(255,255,255,.24); }
    .cover .brand, .cover .slide-number, .cover .category, .cover .hint { color: #d8eee1; }
    .cover .brand img { filter: brightness(0) invert(1); }
    .cover .content { grid-template-columns: 1fr .32fr; }
    .cover h1 { color: white; max-width: 1050px; }
    .cover .summary { color: #e7f4eb; }
    .cover .presenter-info { color: white; }

    .cover-mark {
      display: grid;
      place-items: center;
      justify-self: end;
      width: clamp(150px, 19vw, 310px);
      aspect-ratio: 1;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      background: rgba(255,255,255,.08);
    }

    .cover-mark img {
      width: 42%;
      height: 68%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    .controls button {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 50%;
      background: rgba(5, 37, 20, .78);
      color: white;
      cursor: pointer;
      font-size: 21px;
      line-height: 1;
    }

    .controls button:hover,
    .controls button:focus-visible {
      background: var(--kfupm-green);
      outline: 3px solid rgba(24,125,67,.25);
    }

    .progress {
      position: fixed;
      left: 0;
      bottom: 0;
      z-index: 11;
      height: 5px;
      width: 0;
      background: #69c38f;
      transition: width 180ms ease;
    }

    @media (max-width: 820px), (max-aspect-ratio: 4/3) {
      .slide { padding: 24px 28px 34px 40px; }
      .content, .cover .content { grid-template-columns: 1fr; gap: 28px; }
      .facts { border-left: 0; border-top: 3px solid var(--kfupm-green); padding: 20px 0 0; }
      .fact { display: inline-block; vertical-align: top; width: 48%; margin-bottom: 16px; padding-right: 18px; }
      .cover-mark { display: none; }
      .hint { display: none; }
    }

    @media print {
      html, body { overflow: visible; background: white; }
      .deck { height: auto; }
      .slide { position: relative; width: 100vw; height: 56.25vw; page-break-after: always; opacity: 1; visibility: visible; transform: none; }
      .controls, .progress { display: none; }
    }
  </style>
</head>
<body>
  <main class="deck" id="deck" aria-live="polite"></main>

  <nav class="controls" aria-label="Slide controls">
    <button id="previous" type="button" aria-label="Previous slide">‹</button>
    <button id="next" type="button" aria-label="Next slide">›</button>
  </nav>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <script>
    const datasets = [
      {
        name: "dcase2025-audio-qa",
        type: "Audio Question Answering",
        language: "English",
        size: "15,571 samples",
        audio: true, questions: true, answers: true,
        note: "A direct Audio QA dataset with audio, questions, and multiple-choice answers. It is ready for baseline experiments.",
        url: "https://huggingface.co/datasets/gijs/dcase2025-audio-qa"
      },
      {
        name: "trivia_qa_audio_score",
        type: "Audio Question Answering",
        language: "English",
        size: "1,000 samples",
        audio: true, questions: true, answers: true,
        note: "A compact direct Audio QA dataset. Its smaller size makes it useful for quick experiments and pipeline checks.",
        url: "https://huggingface.co/datasets/chiyuanhsiao/trivia_qa-audio-score"
      },
      {
        name: "Merged Arabic Corpus of Isolated Words",
        type: "Speech Recognition",
        language: "Arabic",
        size: "1,000 files",
        audio: true, questions: false, answers: false,
        note: "A corpus of isolated Arabic words. It may help with speech recognition tests, but it lacks the context needed for Audio QA.",
        url: "https://www.kaggle.com/datasets/mohamedanwarvic/merged-arabic-corpus-of-isolated-words"
      },
      {
        name: "Quran Ayat Speech to Text",
        type: "Speech to Text",
        language: "Arabic",
        size: "About 232K files",
        audio: true, questions: false, answers: false,
        note: "A large Arabic audio collection with speech-to-text value. Its domain is specialized and it does not contain QA pairs.",
        url: "https://www.kaggle.com/datasets/bigguyubuntu/quran-ayat-speech-to-text/data"
      },
      {
        name: "Arabic Language Comprehension",
        type: "Reading Comprehension",
        language: "Arabic",
        size: "702 samples",
        audio: false, questions: true, answers: true,
        note: "An Arabic text QA source. Recorded or synthesized speech could convert its questions and contexts into an Audio QA format.",
        url: "https://www.kaggle.com/datasets/thedevastator/unlocking-arabic-language-comprehension-with-the?select=validation.csv"
      },
      {
        name: "Shifaa Arabic Mental Health Consultations",
        type: "Text QA / Dialogue",
        language: "Arabic",
        size: "2,256 samples",
        audio: false, questions: true, answers: true,
        note: "Arabic consultation dialogues with QA potential. Adding speech could create a domain-specific spoken QA resource.",
        url: "https://www.kaggle.com/datasets/ahmedseleem/shifaa-arabic-mental-health-consultations"
      },
      {
        name: "Spoken-SQuAD",
        type: "Spoken Question Answering",
        language: "English",
        size: "About 42.3K QA pairs",
        audio: true, questions: true, answers: true,
        note: "A foundational spoken QA benchmark derived from SQuAD. It provides a useful reference point for model comparison.",
        url: "https://github.com/Chia-Hsuan-Lee/Spoken-SQuAD"
      },
      {
        name: "NMSQA",
        type: "Fully Spoken Question Answering",
        language: "English",
        size: "Large-scale, SQuAD-derived",
        audio: true, questions: true, answers: true,
        note: "A strong candidate for fully spoken and textless QA research because both the input context and questions use speech.",
        url: "https://huggingface.co/datasets/voidful/NMSQA"
      },
      {
        name: "SLUE-SQA-5",
        type: "Spoken Question Answering",
        language: "English",
        size: "Questions from 5 QA datasets",
        audio: true, questions: true, answers: true,
        note: "A broad spoken QA benchmark built from five major QA datasets. It offers more varied question sources for evaluation.",
        url: "https://huggingface.co/datasets/asapp/slue-phase-2"
      },
      {
        name: "HeySQuAD Human",
        type: "Spoken Question Answering",
        language: "English",
        size: "76,148 samples",
        audio: true, questions: true, answers: true,
        note: "Human-spoken questions make this dataset useful for evaluating natural speech variation and recognition errors.",
        url: "https://huggingface.co/datasets/yijingwu/HeySQuAD_human"
      },
      {
        name: "HeySQuAD Machine",
        type: "Spoken Question Answering",
        language: "English",
        size: "98,163 samples",
        audio: true, questions: true, answers: true,
        note: "Synthetic spoken questions support controlled experiments and comparison with the human-spoken HeySQuAD dataset.",
        url: "https://huggingface.co/datasets/yijingwu/HeySQuAD_machine"
      },
      {
        name: "LibriSQA",
        type: "Open-ended Spoken QA",
        language: "English",
        size: "About 107K SQA pairs",
        audio: true, questions: true, answers: true,
        note: "A large open-ended spoken QA dataset based on LibriSpeech audio. Its scale makes it suitable for modern model experiments.",
        url: "https://huggingface.co/datasets/ZihanZhao/LibriSQA"
      },
      {
        name: "WebQuestions",
        type: "Open-domain QA",
        language: "English",
        size: "About 5.8K questions",
        audio: false, questions: true, answers: true,
        note: "A smaller set of factual web questions. Its concise questions could support a lightweight spoken QA experiment.",
        url: "https://github.com/brmson/dataset-factoid-webquestions"
      },
      {
        name: "CuratedTREC",
        type: "Factoid Question Answering",
        language: "English",
        size: "About 2K questions",
        audio: false, questions: true, answers: true,
        note: "A compact factoid QA benchmark. Converting its questions to speech could provide a simple evaluation set.",
        url: "https://github.com/brmson/dataset-factoid-curated"
      }
    ];

    const logoPath = "kfupm.svg";
    const deck = document.getElementById("deck");
    const totalSlides = datasets.length + 1;

    function header(number) {
      return `
        <header class="slide-header">
          <div class="brand"><img src="${logoPath}" alt="KFUPM mark"> RES200</div>
          <div class="slide-number">${String(number).padStart(2, "0")} / ${String(totalSlides).padStart(2, "0")}</div>
        </header>`;
    }

    function identityFooter() {
      return `
        <footer class="slide-footer">
          <div class="presenter-info">
            <div>Dr. Hamzah Luqman</div>
            <div class="presenter">Mohammed Alshammasi</div>
          </div>
        </footer>`;
    }

    function coverSlide() {
      return `
        <section class="slide cover active" aria-label="Title slide">
          ${header(1)}
          <div class="content">
            <div>
              <p class="presentation-date">9 September 2026</p>
              <h1>Dataset Exploration for Audio Question Answering</h1>
              <p class="summary">A focused review of 14 audio, speech, and text QA datasets for English and Arabic research.</p>
            </div>
            <div class="cover-mark"><img src="${logoPath}" alt="KFUPM mark"></div>
          </div>
          ${identityFooter()}
        </section>`;
    }

    function datasetSlide(dataset, index) {
      const availability = [
        ["Audio", dataset.audio],
        ["Questions", dataset.questions],
        ["Answers", dataset.answers]
      ].map(([label, yes]) => `<span class="${yes ? "yes" : "no"}">${label}: ${yes ? "Yes" : "No"}</span>`).join("");

      return `
        <section class="slide" aria-label="${dataset.name}">
          ${header(index + 2)}
          <div class="content">
            <div>
              <p class="category">${dataset.type}</p>
              <h1>${dataset.name}</h1>
              <p class="summary">${dataset.note}</p>
              <a class="dataset-link" href="${dataset.url}" target="_blank" rel="noopener noreferrer">Open dataset ↗</a>
            </div>
            <aside class="facts" aria-label="Dataset facts">
              <div class="fact">
                <span class="fact-label">Language</span>
                <span class="fact-value">${dataset.language}</span>
              </div>
              <div class="fact">
                <span class="fact-label">Size</span>
                <span class="fact-value">${dataset.size}</span>
              </div>
              <div class="fact">
                <span class="fact-label">Available</span>
                <div class="availability">${availability}</div>
              </div>
            </aside>
          </div>
          ${identityFooter()}
        </section>`;
    }

    deck.innerHTML = coverSlide() + datasets.map(datasetSlide).join("");

    const slides = [...document.querySelectorAll(".slide")];
    const progress = document.getElementById("progress");
    let current = Math.min(Math.max(Number(location.hash.slice(1)) || 1, 1), slides.length) - 1;

    function showSlide(nextIndex, updateHash = true) {
      current = Math.min(Math.max(nextIndex, 0), slides.length - 1);
      slides.forEach((slide, index) => {
        slide.classList.toggle("active", index === current);
        slide.classList.toggle("previous", index < current);
        slide.setAttribute("aria-hidden", index === current ? "false" : "true");
      });
      progress.style.width = `${((current + 1) / slides.length) * 100}%`;
      if (updateHash) history.replaceState(null, "", `#${current + 1}`);
      document.title = current === 0
        ? "Dataset Exploration | RES200 Week 02"
        : `${datasets[current - 1].name} | RES200 Week 02`;
    }

    document.getElementById("previous").addEventListener("click", () => showSlide(current - 1));
    document.getElementById("next").addEventListener("click", () => showSlide(current + 1));
    document.addEventListener("keydown", event => {
      if (["ArrowRight", "PageDown", " "].includes(event.key)) {
        event.preventDefault();
        showSlide(current + 1);
      }
      if (["ArrowLeft", "PageUp"].includes(event.key)) {
        event.preventDefault();
        showSlide(current - 1);
      }
      if (event.key === "Home") showSlide(0);
      if (event.key === "End") showSlide(slides.length - 1);
    });
    window.addEventListener("hashchange", () => {
      const requested = Number(location.hash.slice(1));
      if (requested) showSlide(requested - 1, false);
    });

    let touchStartX = 0;
    document.addEventListener("touchstart", event => { touchStartX = event.changedTouches[0].screenX; }, { passive: true });
    document.addEventListener("touchend", event => {
      const distance = event.changedTouches[0].screenX - touchStartX;
      if (Math.abs(distance) > 60) showSlide(current + (distance < 0 ? 1 : -1));
    }, { passive: true });

    showSlide(current, false);
  </script>
</body>
</html>
